name: Build DiskCC Windows EXE

on:
  push:
    tags:
      - 'v*'            # 打 tag 时自动构建并发布 Release
  workflow_dispatch:    # 也支持手动在 Actions 页面点一下触发

permissions:
  contents: write       # 创建 Release 并上传资产所需（默认只读会导致发布失败）

env:
  PYTHONUTF8: "1"       # Windows 运行器默认 cp1252，中文/emoji 输出会抛 UnicodeEncodeError，强制 Python 走 UTF-8

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30        # 安全兜底：任何步骤卡死（如 Defender 扫描）都不会挂满 6 小时
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Disable Windows Defender real-time scan (avoid onefile extraction stall)
        shell: pwsh
        run: |
          # PyInstaller 单文件 exe 首次运行会解包到 %TEMP%\_MEIxxxx，Defender 实时扫描会卡死。
          # runner 以管理员运行，加入排除后可正常解包。
          try {
            Add-MpPreference -ExclusionPath $env:TEMP -ErrorAction Stop
            Add-MpPreference -ExclusionPath "${{ github.workspace }}" -ErrorAction Stop
            Write-Host "Defender exclusions added"
          } catch {
            Write-Warning "无法添加 Defender 排除（可能无权限），继续：$_"
          }

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-build.txt

      - name: Run regression tests
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:DISKCC_CI_SKIP_GUI = '1'   # CI offscreen 下跳过易崩的纯 GUI 段（本地覆盖）
          python tests/full_test.py
        shell: pwsh

      - name: Build EXE with PyInstaller (single-file)
        shell: pwsh
        run: |
          pyinstaller --noconfirm DiskCC.spec
          # 暂存单文件 exe：后续 onedir 构建的 --clean 会清空整个 dist/，先把单文件挪到 stage/
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          Copy-Item dist\DiskCC.exe stage\DiskCC.onefile.exe
          Write-Host "single-file exe 构建完成"

      - name: Build onedir package (recommended distribution)
        shell: pwsh
        run: |
          $env:DISKCC_ONEDIR = '1'
          # --clean 会清空整个 dist/，但单文件 exe 已暂存到 stage/，不受波及
          pyinstaller --noconfirm --clean DiskCC.spec
          # 恢复单文件 exe 到 dist/（与 onedir 目录 dist/DiskCC/ 并存）
          Copy-Item stage\DiskCC.onefile.exe dist\DiskCC.exe
          # ---- 产物静态校验（无论能否启动冒烟都要做，防止空壳产物被发布）----
          $exe = "dist\DiskCC\DiskCC.exe"
          if (-not (Test-Path $exe)) { Write-Error "onedir exe 不存在：$exe"; exit 1 }
          $size = (Get-Item $exe).Length
          Write-Host "onedir exe size = $size bytes"
          if ($size -lt 5MB) { Write-Error "onedir exe 体积异常（$size），疑似构建失败"; exit 1 }
          foreach ($needle in @("python3", "Qt6Core", "Qt6Widgets", "Qt6Gui", "qwindows")) {
            $hit = Get-ChildItem -Path "dist\DiskCC\_internal" -Recurse -Filter "*$needle*" -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $hit) { Write-Error "onedir 产物缺少关键依赖：$needle"; exit 1 }
            Write-Host "  依赖检查 OK: $needle -> $($hit.Name)"
          }
          # 确认瘦身生效（这几项目录属于纯资源，运行时不会加载）
          $left = @(Get-ChildItem -Path "dist\DiskCC\_internal" -Recurse -Directory -ErrorAction SilentlyContinue | Where-Object { $_.Name -in @("qml", "translations", "metatypes") })
          if ($left) {
            Write-Host "⚠️ 仍存在未裁剪目录：$($left.Name -join ', ')"
          } else {
            Write-Host "✅ qml / translations / metatypes 已裁掉"
          }

          # ---- 启动冒烟 ----
          # v1.3.4 起 exe 恢复 requireAdministrator（默认提权）。未提升的会话里
          # CreateProcess 会直接失败（740，需要提权）而不是挂起，因此先判断当前
          # 是否已提升：未提升时跳过启动验证（只保留上面的静态校验），避免误判
          # 构建失败。
          $curId = [Security.Principal.WindowsIdentity]::GetCurrent()
          $curPrincipal = [Security.Principal.WindowsPrincipal]$curId
          $elevated = $curPrincipal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          Write-Host "runner elevated = $elevated"
          if (-not $elevated) {
            Write-Host "⚠️ 当前会话未提升，requireAdministrator 的 exe 无法在此启动；跳过启动冒烟（静态校验已通过）"
          } else {
            # GUI（console=False）exe 不接管控制台；重定向到文件才能拿到输出。
            $env:QT_QPA_PLATFORM = 'offscreen'   # 防御性：避免 Qt 在无显示环境初始化异常
            $so = "onedir_smoke.out"; $se = "onedir_smoke.err"
            try {
              $p = Start-Process -FilePath $exe -ArgumentList "--version" -PassThru `
                   -RedirectStandardOutput $so -RedirectStandardError $se -WindowStyle Hidden
            } catch {
              Write-Error "onedir exe 无法启动（$($_.Exception.Message)）"; exit 1
            }
            # 用 HasExited 轮询代替 WaitForExit：区分"进程真没退出"与"WaitForExit
            # 对窗口化进程不返回"两种情况。
            $exited = $false
            for ($k = 0; $k -lt 60; $k++) {
              Start-Sleep -Seconds 1
              if ($p.HasExited) { $exited = $true; break }
            }
            Write-Host "=== onedir stdout ==="; Get-Content $so -ErrorAction SilentlyContinue
            Write-Host "=== onedir stderr ==="; Get-Content $se -ErrorAction SilentlyContinue
            Write-Host "=== bootstrap error ==="; Get-Content "$env:TEMP\diskcc_bootstrap_error.txt" -ErrorAction SilentlyContinue
            Write-Host "ExitCode=$($p.ExitCode) Exited=$exited"
            if (-not $exited) { $p.Kill(); Write-Error "onedir exe smoke test timed out"; exit 1 }
            if ($p.ExitCode -ne 0) { Write-Error "onedir exe smoke test failed (exit $($p.ExitCode))"; exit 1 }
            Write-Host "onedir exe 启动正常"
          }
          Compress-Archive -Path dist\DiskCC -DestinationPath "DiskCC-${{ github.ref_name }}-win64.zip"

      # CI（offscreen / 无事件循环）环境下 Windows Defender 会实时扫描 PyInstaller
      # 单文件 exe 解包到 %TEMP%\_MEIxxxx 的过程，偶发卡死（与产品代码无关）。
      # 故单文件 exe 冒烟仅作"尽力而为"检查，失败不阻断发布；发布仍包含单文件 exe，
      # 真正推荐的分发形态是上面的 onedir（无解包、从程序目录加载）。
      - name: Smoke test single-file exe (best-effort)
        continue-on-error: true
        shell: pwsh
        run: |
          $curId = [Security.Principal.WindowsIdentity]::GetCurrent()
          $curPrincipal = [Security.Principal.WindowsPrincipal]$curId
          $elevated = $curPrincipal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          if (-not $elevated) {
            Write-Warning "会话未提升，requireAdministrator 的单文件 exe 无法启动；跳过单文件冒烟"
            exit 0
          }
          $env:QT_QPA_PLATFORM = 'offscreen'
          $so = "onefile_smoke.out"; $se = "onefile_smoke.err"
          $p = Start-Process -FilePath "dist\DiskCC.exe" -ArgumentList "--version" -PassThru `
               -RedirectStandardOutput $so -RedirectStandardError $se -WindowStyle Hidden
          if (-not $p.WaitForExit(150000)) { $p.Kill(); Write-Warning "onefile exe 冒烟超时（CI 解包被扫描，非产品问题）"; exit 0 }
          Write-Host "=== onefile stdout ==="; Get-Content $so -ErrorAction SilentlyContinue
          Write-Host "=== onefile stderr ==="; Get-Content $se -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { Write-Warning "onefile exe 冒烟退出码 $($p.ExitCode)"; exit 0 }
          Write-Host "single-file exe 启动正常"

      - name: Compute SHA256
        shell: pwsh
        run: |
          (Get-FileHash dist/DiskCC.exe -Algorithm SHA256).Hash | Out-File -Encoding utf8 dist/DiskCC.exe.sha256.txt
          Get-Content dist/DiskCC.exe.sha256.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiskCC-exe
          path: |
            dist/DiskCC.exe
            dist/DiskCC.exe.sha256.txt
            DiskCC-*-win64.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/DiskCC.exe
            DiskCC-${{ github.ref_name }}-win64.zip
            dist/DiskCC.exe.sha256.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
