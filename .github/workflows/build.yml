name: Build DiskCC Windows EXE

on:
  push:
    tags:
      - 'v*'            # 打 tag 时自动构建并发布 Release
  workflow_dispatch:    # 也支持手动在 Actions 页面点一下触发

permissions:
  contents: write       # 创建 Release 并上传资产所需（默认只读会导致发布失败）

env:
  PYTHONUTF8: "1"       # Windows 运行器默认 cp1252，中文/emoji 输出会抛 UnicodeEncodeError，强制 Python 走 UTF-8

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30        # 安全兜底：任何步骤卡死（如 Defender 扫描）都不会挂满 6 小时
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Disable Windows Defender real-time scan (avoid onefile extraction stall)
        shell: pwsh
        run: |
          # PyInstaller 单文件 exe 首次运行会解包到 %TEMP%\_MEIxxxx，Defender 实时扫描会卡死。
          # runner 以管理员运行，加入排除后可正常解包。
          try {
            Add-MpPreference -ExclusionPath $env:TEMP -ErrorAction Stop
            Add-MpPreference -ExclusionPath "${{ github.workspace }}" -ErrorAction Stop
            Write-Host "Defender exclusions added"
          } catch {
            Write-Warning "无法添加 Defender 排除（可能无权限），继续：$_"
          }

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-build.txt

      - name: Run regression tests
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:DISKCC_CI_SKIP_GUI = '1'   # CI offscreen 下跳过易崩的纯 GUI 段（本地覆盖）
          python tests/full_test.py
        shell: pwsh

      - name: Build EXE with PyInstaller (single-file)
        run: |
          pyinstaller --noconfirm --clean DiskCC.spec

      - name: Smoke test single-file exe (--version)
        shell: pwsh
        run: |
          # 注意：runner 的 PowerShell 不支持 Start-Process 的 -TimeoutSec，
          # 改用 WaitForExit(ms) 做超时兜底（兼容 PS 5.1 / 7）。
          $p = Start-Process -FilePath "dist\DiskCC.exe" -ArgumentList "--version" -PassThru
          if (-not $p.WaitForExit(180000)) {
            Write-Warning "onefile exe 未在 180s 内退出，强制结束"
            $p.Kill()
            Write-Error "onefile exe smoke test timed out"; exit 1
          }
          Write-Host "single-file exe exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { Write-Error "onefile exe smoke test failed (exit $($p.ExitCode))"; exit 1 }
          Write-Host "single-file exe 启动正常"

      - name: Build onedir package (recommended distribution)
        shell: pwsh
        run: |
          $env:DISKCC_ONEDIR = '1'
          pyinstaller --noconfirm --clean DiskCC.spec
          $p = Start-Process -FilePath "dist\DiskCC\DiskCC.exe" -ArgumentList "--version" -PassThru
          if (-not $p.WaitForExit(180000)) {
            Write-Warning "onedir exe 未在 180s 内退出，强制结束"
            $p.Kill()
            Write-Error "onedir exe smoke test timed out"; exit 1
          }
          Write-Host "onedir exe exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { Write-Error "onedir exe smoke test failed (exit $($p.ExitCode))"; exit 1 }
          Write-Host "onedir exe 启动正常"
          Compress-Archive -Path dist\DiskCC -DestinationPath "DiskCC-${{ github.ref_name }}-win64.zip"

      - name: Compute SHA256
        shell: pwsh
        run: |
          (Get-FileHash dist/DiskCC.exe -Algorithm SHA256).Hash | Out-File -Encoding utf8 dist/DiskCC.exe.sha256.txt
          Get-Content dist/DiskCC.exe.sha256.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiskCC-exe
          path: |
            dist/DiskCC.exe
            dist/DiskCC.exe.sha256.txt
            DiskCC-*-win64.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/DiskCC.exe
            DiskCC-${{ github.ref_name }}-win64.zip
            dist/DiskCC.exe.sha256.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
